[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yuqing-agent"
version = "0.1.0"
description = "可核验的舆情专报 Agent"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.135,<1",
  "httpx>=0.28,<1",
  "jinja2>=3.1,<4",
  "openai>=2,<3",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.10,<3",
  "python-dotenv>=1.1,<2",
  "python-frontmatter>=1.1,<2",
  "pyyaml>=6,<7",
  "tenacity>=9,<10",
  "trafilatura>=2,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "import-linter>=2.3,<3",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[project.scripts]
yuqing-llm-ping = "yuqing.scripts.llm_ping:run"
yuqing-search-probe = "yuqing.scripts.search_probe:run"

[tool.hatch.build.targets.wheel]
packages = ["yuqing"]

[tool.fastapi]
entrypoint = "yuqing.app.main:app"

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
