services:
  app:
    image: ${YUQING_APP_IMAGE:-opc-agent-app:production}
    pull_policy: missing
    restart: unless-stopped
    env_file: .env.production
    environment:
      YUQING_DATA_DIR: /app/data
      YUQING_DEMO_MODE: "false"
      YUQING_AUTH_REQUIRED: "true"
    expose:
      - "8000"
    volumes:
      - yuqing-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request,sys; body=json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)); sys.exit(0 if body.get('status') == 'ok' else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  gateway:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      YUQING_DOMAIN: ${YUQING_DOMAIN:?Set YUQING_DOMAIN in .env.production}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile.production:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  yuqing-data:
  caddy-data:
  caddy-config:
